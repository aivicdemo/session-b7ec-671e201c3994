<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作業管理システム - ログイン画面</title>
  <style>
    :root {
      /* Primary & Accent */
      --primary: #f59e0b;
      --primary-hover: #d97706;

      /* Background Palette - 明るく爽やかなベース */
      --bg-main: #fefdf8;
      --bg-card: #faf8f3;
      --bg-sidebar: #f5f1e8;

      /* Top Bar - 明るさを保ちながら視覚的な分離 */
      --top-bar-bg: #fffbf0;
      --top-bar-border: #f3e8d8;
      --top-bar-text: #1f2937;

      /* Text Colors */
      --text: #1f2937;
      --text-muted: #6b7280;

      /* Borders & Dividers */
      --border: #e5ddd0;
      --border-width: 1px;

      /* Typography */
      --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;

      /* Spacing & Sizing */
      --space-unit: 8px;
      --control-height: 40px;
      --radius-card: 12px;
      --radius-control: 8px;

      /* Shadows - 柔らかく明るい環境に合わせた浮遊感 */
      --shadow-card: 0 2px 8px rgba(31, 41, 55, 0.08), 0 1px 3px rgba(31, 41, 55, 0.04);

      /* Motion */
      --motion-duration: 200ms;

      /* Surface Texture - 明るく温かみのある紙のような質感 */
      --surface-texture: 
        linear-gradient(90deg, transparent 0%, rgba(245, 158, 11, 0.02) 50%, transparent 100%),
        repeating-linear-gradient(
          0deg,
          transparent 0px,
          rgba(245, 158, 11, 0.01) 1px,
          transparent 2px,
          transparent 4px
        );
      --surface-texture-size: 100% 100%;
      --surface-texture-position: 0 0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: var(--font-family);
      background: linear-gradient(135deg, var(--bg-main) 0%, #fdf9f0) 1);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: var(--space-unit);
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .login-card {
      background: var(--bg-card);
      border: var(--border-width) solid var(--border);
      border-radius: var(--radius-card);
      padding: calc(var(--space-unit) * 6);
      box-shadow: var(--shadow-card);
      background-image: var(--surface-texture);
      background-size: var(--surface-texture-size);
      background-position: var(--surface-texture-position);
    }

    .login-header {
      text-align: center;
      margin-bottom: calc(var(--space-unit) * 5);
    }

    .login-logo {
      width: 48px;
      height: 48px;
      margin: 0 auto calc(var(--space-unit) * 3);
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
      border-radius: var(--radius-control);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 24px;
      color: white;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
    }

    .login-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: calc(var(--space-unit) * 1);
      letter-spacing: -0.5px;
    }

    .login-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: calc(var(--space-unit) * 3);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: calc(var(--space-unit) * 1.5);
    }

    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input {
      height: var(--control-height);
      padding: 0 calc(var(--space-unit) * 2);
      border: var(--border-width) solid var(--border);
      border-radius: var(--radius-control);
      font-family: var(--font-family);
      font-size: 14px;
      color: var(--text);
      background: white;
      transition: all var(--motion-duration) ease;
      outline: none;
    }

    .form-input::placeholder {
      color: var(--text-muted);
    }

    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1);
      background: #fffcf8;
    }

    .form-input:hover:not(:focus) {
      border-color: #d4cfc5;
    }

    .login-button {
      height: var(--control-height);
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
      color: white;
      border: none;
      border-radius: var(--radius-control);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--motion-duration) ease;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: calc(var(--space-unit) * 1);
    }

    .login-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(245, 158, 11, 0.35);
    }

    .login-button:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.25);
    }

    .login-footer {
      margin-top: calc(var(--space-unit) * 5);
      padding-top: calc(var(--space-unit) * 4);
      border-top: var(--border-width) solid var(--border);
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .login-footer strong {
      color: var(--primary);
      font-weight: 600;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: calc(var(--space-unit) * 4);
      }

      .login-title {
        font-size: 24px;
      }

      .login-subtitle {
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .form-input,
      .login-button {
        transition: none;
      }

      .login-button:hover {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">⚙</div>
        <h1 class="login-title" data-testid="login-title">ログイン</h1>
        <p class="login-subtitle">作業進捗・人員配置最適化エンジン</p>
      </div>

      <form class="login-form" data-testid="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">ユーザー名</label>
          <input
            class="form-input"
            id="username"
            type="text"
            name="username"
            data-testid="username"
            placeholder="ユーザー名を入力"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">パスワード</label>
          <input
            class="form-input"
            id="password"
            type="password"
            name="password"
            data-testid="password"
            placeholder="パスワードを入力"
          >
        </div>

        <button
          class="login-button"
          type="submit"
          data-testid="login-button"
        >
          ログイン
        </button>
      </form>

      <div class="login-footer">
        <strong>サンプル実装:</strong> どの入力でもログインできます
      </div>
    </div>
  </div>

  <script>
    document.querySelector('[data-testid="login-form"]').addEventListener('submit', function(e) {
      e.preventDefault();
      window.location.href = './index.html';
    });
  </script>
</body>
</html>
